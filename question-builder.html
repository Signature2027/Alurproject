<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Question Builder</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside><h2>সততা শিক্ষা</h2><a href="dashboard.html">🏠 Dashboard</a><a href="question-pattern.html">🧩 Question Pattern</a><a href="question-bank.html">📚 Question Bank</a><a class="active" href="question-builder.html">📝 Question Builder</a><button class="logout" onclick="logout()">Logout</button></aside>
<main><header><div><h1>Question Paper Builder</h1><p class="muted">Pattern select করে paper তৈরি করুন</p></div></header>
<div class="card"><div class="formgrid"><input id="school" value="সততা প্রি ক্যাডেট স্কুল" placeholder="School Name"><input id="exam" placeholder="Exam Name"><select id="cls"><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option></select><input id="subject" placeholder="Subject"><select id="pattern"></select></div><button onclick="build()">Apply Pattern</button></div>
<div id="preview" class="paper"></div></main></div><script src="js/app.js"></script><script>requireLogin();function load(){let ps=JSON.parse(localStorage.getItem('patterns')||'[]');pattern.innerHTML='<option value="">Pattern নির্বাচন করুন</option>'+ps.map(p=>`<option value="${p.id}">${p.name} — ${p.cls}</option>`).join('')}function build(){let ps=JSON.parse(localStorage.getItem('patterns')||'[]');let p=ps.find(x=>x.id==pattern.value);if(!p)return alert('Pattern নির্বাচন করুন');let qs=JSON.parse(localStorage.getItem('questions')||'[]');let html=`<h1>${school.value}</h1><h2>${exam.value||p.exam||'পরীক্ষা'} — ${subject.value||p.subject}</h2><p><b>শ্রেণি:</b> ${cls.value} &nbsp; <b>পূর্ণমান:</b> ${p.items.reduce((a,x)=>a+x.num*x.mark,0)}</p><hr>`;let no=1;p.items.forEach(it=>{html+=`<h3>${it.section||it.type}</h3>`;let matches=qs.filter(q=>q.cls===p.cls&&(!p.subject||q.subject===p.subject)&&q.type===it.type);for(let i=0;i<it.num;i++){let q=matches[i];html+=`<p><b>${no++}.</b> ${q?q.text:'________________________________'} <span>(${it.mark})</span></p>`}});preview.innerHTML=html+'<button class="printbtn" onclick="window.print()">🖨 Print / Save PDF</button>'}load()</script></body></html>
