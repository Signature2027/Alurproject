<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Question Bank</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside><h2>সততা শিক্ষা</h2><a href="dashboard.html">🏠 Dashboard</a><a href="question-pattern.html">🧩 Question Pattern</a><a class="active" href="question-bank.html">📚 Question Bank</a><a href="question-builder.html">📝 Question Builder</a><button class="logout" onclick="logout()">Logout</button></aside><main><header><div><h1>Question Bank</h1></div></header>
<div class="card"><div class="formgrid"><select id="qclass"><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option></select><input id="qsubject" placeholder="Subject"><input id="chapter" placeholder="Chapter"><select id="qtype"><option>MCQ</option><option>Short</option><option>Fill in the blank</option><option>Creative</option><option>Problem</option></select></div><textarea id="qtext" placeholder="Question লিখুন"></textarea><input id="answer" placeholder="Answer (optional)"><input id="qmarks" type="number" min="1" value="1" placeholder="Marks"><button onclick="addQuestion()">Add Question</button></div>
<div class="card"><h2>Saved Questions</h2><div id="qlist"></div></div></main></div><script src="js/app.js"></script><script>requireLogin();function addQuestion(){if(!qtext.value.trim())return alert('Question লিখুন');let qs=JSON.parse(localStorage.getItem('questions')||'[]');qs.push({id:Date.now(),cls:qclass.value,subject:qsubject.value,chapter:chapter.value,type:qtype.value,text:qtext.value,answer:answer.value,marks:+qmarks.value});localStorage.setItem('questions',JSON.stringify(qs));qtext.value='';answer.value='';render();refreshStats()}function del(id){let qs=JSON.parse(localStorage.getItem('questions')||'[]').filter(x=>x.id!==id);localStorage.setItem('questions',JSON.stringify(qs));render();refreshStats()}function render(){let qs=JSON.parse(localStorage.getItem('questions')||'[]');qlist.innerHTML=qs.length?qs.map((q,i)=>`<div class="listitem"><div><b>${i+1}. ${q.text}</b><span>${q.cls} • ${q.subject||'—'} • ${q.type} • ${q.marks} mark</span></div><button class="small danger" onclick="del(${q.id})">Delete</button></div>`).join(''):'<p class="muted">কোনো প্রশ্ন নেই।</p>'}render();</script></body></html>
