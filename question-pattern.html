<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Question Pattern</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside><h2>সততা শিক্ষা</h2><a href="dashboard.html">🏠 Dashboard</a><a class="active" href="question-pattern.html">🧩 Question Pattern</a><a href="question-bank.html">📚 Question Bank</a><a href="question-builder.html">📝 Question Builder</a><button class="logout" onclick="logout()">Logout</button></aside>
<main><header><div><h1>Question Pattern Manager</h1><p class="muted">নিজের মতো যত খুশি pattern তৈরি করুন</p></div></header>
<div class="card"><h2>নতুন Pattern</h2><div class="formgrid"><input id="pname" placeholder="Pattern Name"><select id="pclass"><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option></select><input id="psubject" placeholder="Subject"><input id="pexam" placeholder="Exam Name"></div>
<div id="rows"></div><button class="secondary" onclick="addRow()">+ Question Type</button><button onclick="savePattern()">Save Pattern</button></div>
<div class="card"><h2>Saved Patterns</h2><div id="list"></div></div></main></div>
<script src="js/app.js"></script><script>requireLogin();let editing=null;function addRow(t='',n=1,m=1,s=''){let d=document.createElement('div');d.className='pattern-row';d.innerHTML=`<input class="sec" placeholder="Section" value="${s}"><input class="type" placeholder="Question Type" value="${t}"><input class="num" type="number" min="1" value="${n}"><input class="mark" type="number" min="1" value="${m}"><button class="danger" onclick="this.parentElement.remove()">×</button>`;rows.appendChild(d)}addRow();function savePattern(){let name=pname.value.trim();if(!name)return alert('Pattern name দিন');let items=[...document.querySelectorAll('.pattern-row')].map(r=>({section:r.querySelector('.sec').value,type:r.querySelector('.type').value,num:+r.querySelector('.num').value,mark:+r.querySelector('.mark').value}));let ps=JSON.parse(localStorage.getItem('patterns')||'[]');let obj={id:editing||Date.now(),name,cls:pclass.value,subject:psubject.value,exam:pexam.value,items};let i=ps.findIndex(x=>x.id===obj.id);i>=0?ps[i]=obj:ps.push(obj);localStorage.setItem('patterns',JSON.stringify(ps));editing=null;resetForm();render();refreshStats();alert('Pattern saved')}function resetForm(){pname.value='';psubject.value='';pexam.value='';rows.innerHTML='';addRow()}function render(){let ps=JSON.parse(localStorage.getItem('patterns')||'[]');list.innerHTML=ps.length?ps.map(p=>`<div class="listitem"><b>${p.name}</b><span>${p.cls} • ${p.subject||'—'} • ${p.items.reduce((a,x)=>a+x.num*x.mark,0)} marks</span><div><button class="small" onclick='editPattern(${p.id})'>Edit</button><button class="small danger" onclick='deletePattern(${p.id})'>Delete</button></div></div>`).join(''):'<p class="muted">কোনো pattern নেই।</p>'}function editPattern(id){let p=JSON.parse(localStorage.getItem('patterns')||'[]').find(x=>x.id===id);if(!p)return;editing=id;pname.value=p.name;pclass.value=p.cls;psubject.value=p.subject;pexam.value=p.exam;rows.innerHTML='';p.items.forEach(x=>addRow(x.type,x.num,x.mark,x.section));scrollTo(0,0)}function deletePattern(id){if(confirm('Delete করবেন?')){let ps=JSON.parse(localStorage.getItem('patterns')||'[]').filter(x=>x.id!==id);localStorage.setItem('patterns',JSON.stringify(ps));render();refreshStats()}}render();</script></body></html>
