<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotota Education — Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="center"><div class="card login">
<h1>সততা শিক্ষা</h1><p class="muted">Education Management — Phase 1</p>
<input id="username" placeholder="Username" value="admin"><input id="password" type="password" placeholder="Password" value="1234">
<button onclick="login()">Login</button><p class="hint">Demo: admin / 1234</p></div>
<script src="js/app.js"></script><script>function login(){const u=username.value,p=password.value;if(u==='admin'&&p==='1234'){localStorage.setItem('sotota_login','1');location.href='dashboard.html'}else alert('Username or password ভুল।')}</script>
</body></html>
